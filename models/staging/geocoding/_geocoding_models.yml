version: 2

models:
  - name: stg_geocoding__ohio_addresses
    description: Staging model for reverse geocoded Ohio charging station addresses with parsed address components
    columns:
      - name: station_id
        description: Unique identifier for the charging station
        tests:
          - not_null
          - unique
  - name: stg_geocoding__water_meters
    description: Staging model for Address Points within the Cleveland Water Division service area. Strictly speaking, these aren't exactly water meters. But "Address points within..." is a mouthful.
    columns:
      - name: point_id
        description: Unique identifier for the address point
        tests:
          - not_null
          - unique